name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the app to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version

      - name: Build (Apple Silicon + Intel)
        run: ./build.sh universal

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/USBPhotoPull.app USBPhotoPull.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: USBPhotoPull
          path: USBPhotoPull.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "USBPhotoPull $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" USBPhotoPull.zip --clobber
